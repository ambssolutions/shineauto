<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shine Auto Repairs · Your mix as a full page</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
:root{--ink:#121417;--paper:#f4f2ee;--accent:#f39a36;--muted:#5d5a54}
*{box-sizing:border-box}
html,body{margin:0;background:#0c0d10}
body{font:500 14px/1.4 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--paper)}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:999px;background:rgba(18,20,23,.94);box-shadow:0 14px 30px -10px rgba(0,0,0,.6);max-width:calc(100% - 20px)}
.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a,.bar button{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:none;color:inherit;font:inherit;text-decoration:none;cursor:pointer}
.bar a.go{background:var(--accent);border-color:var(--accent);color:#2a1300}
.note{max-width:760px;margin:0 auto;padding:18px 20px;text-align:center;color:#c9c6bf;background:#16181c;border-bottom:1px solid rgba(255,255,255,.08)}
.note b{color:#fff}
.part{position:relative;background:#0c0d10}
.part iframe{display:block;width:100%;border:0;height:900px}
.tag{position:absolute;right:12px;top:12px;z-index:5;padding:5px 10px;border-radius:999px;background:rgba(18,20,23,.85);color:#fff;font-size:12px;pointer-events:none}
.part.loading::after{content:"Loading…";position:absolute;inset:0;display:grid;place-items:center;color:#8f8b84}
.empty{max-width:560px;margin:18vh auto;padding:0 20px;text-align:center}
.empty a{color:var(--accent)}
@media (max-width:600px){.bar span{display:none}}
</style>
</head>
<body>
<p class="note" id="note"><b>Your mix as one page.</b> Each section is the real one from its concept, so it keeps that concept's colours for now. In the final build every section is redrawn in your chosen overall look.</p>
<main id="parts"></main>
<div class="bar" id="bar"><span id="summary"></span><a href="mix" id="back">Change picks</a><a class="go" id="send" href="mix">Send this mix</a></div>

<script src="assets/mix-data.js?v=2"></script>
<script>
(function () {
  var M = window.MIX, d = document, NAMES = {};
  M.designs.forEach(function (x) { NAMES[x[0]] = x[1]; });
  // picks: from ?mix= (a shared link) or this browser's saved picks
  var picks = {}, q = new URLSearchParams(location.search).get("mix");
  if (q) q.split(",").forEach(function (p) {
    var a = p.split("."), dz = M.designs.find(function (x) { return x[0].slice(0, 2) === a[1]; });
    picks[a[0]] = a[1] === "none" ? "none" : dz ? dz[0] : null;
  });
  else { try { picks = JSON.parse(localStorage.getItem("shine-mix") || "{}") || {}; } catch (e) {} }

  var list = M.sections.filter(function (s) { return s.key !== "style" && picks[s.key] && picks[s.key] !== "none"; });
  var mixq = M.sections.filter(function (s) { return picks[s.key]; }).map(function (s) { return s.key + "." + (picks[s.key] === "none" ? "none" : picks[s.key].slice(0, 2)); }).join(",");
  d.getElementById("back").href = "mix" + (mixq ? "?mix=" + encodeURIComponent(mixq) + "#summary" : "");
  d.getElementById("send").href = "mix" + (mixq ? "?mix=" + encodeURIComponent(mixq) : "") + "#summary";
  if (!list.length) {
    d.getElementById("note").hidden = true; d.getElementById("bar").hidden = true;
    d.getElementById("parts").innerHTML = '<div class="empty"><h1>No picks yet</h1><p>Choose a version of each section first, then come back here to see them as one page.</p><p><a href="mix">Open the section picker</a></p></div>';
    return;
  }
  d.getElementById("summary").textContent = list.length + " sections" + (picks.style && picks.style !== "none" ? " · look: " + NAMES[picks.style] : "");

  // each part is the real concept page in a frame, scrolled to its section and sized to fit it
  var HIDE = "html{scroll-behavior:auto!important}*{content-visibility:visible!important;contain-intrinsic-size:none!important}[data-concept-switcher],.quick,.qbar,.qb,.quickbar,.mbar,.qbar-wrap{display:none!important}";
  var HIDE_HEADER = "body>header{display:none!important}";
  list.forEach(function (s, i) {
    var slug = picks[s.key], sel = M.selFor(s, slug);
    var part = d.createElement("section"); part.className = "part loading"; part.setAttribute("aria-label", s.name + ", from " + NAMES[slug]);
    var tag = d.createElement("span"); tag.className = "tag"; tag.textContent = s.name + " · " + NAMES[slug];
    var f = d.createElement("iframe"); f.title = s.name + " from the " + NAMES[slug] + " concept"; f.setAttribute("scrolling", "no");
    part.appendChild(f); part.appendChild(tag); d.getElementById("parts").appendChild(part);
    f.dataset.src = "designs/" + slug + "/"; f.dataset.sel = sel; f.dataset.key = s.key; f.dataset.first = i === 0 ? "1" : "";
  });

  // Each frame keeps only its chosen section: everything else on that concept page is hidden, so the frame's
  // content is exactly the section. This works even on phone browsers that size frames to their content.
  function isolate(f) {
    var w = f.contentWindow, doc = w.document, key = f.dataset.key;
    if (doc.documentElement.hasAttribute("data-mix-isolated")) return true;
    var el = key === "footer" ? doc.querySelector("body > footer, footer") : doc.querySelector(f.dataset.sel);
    if (!el) return false;
    var st = doc.createElement("style"); st.id = "mixhide";
    st.textContent = HIDE + (f.dataset.first ? "" : HIDE_HEADER) + "[data-mixoff]{display:none!important}";
    doc.head.appendChild(st);
    var keep = el;
    while (keep && keep !== doc.body) {
      var parent = keep.parentElement;
      [].forEach.call(parent.children, function (sib) {
        if (sib === keep || /^(SCRIPT|STYLE|LINK|TEMPLATE)$/.test(sib.tagName)) return;
        if (f.dataset.first && parent === doc.body && sib.matches("header")) return;
        if (sib.matches("[data-concept-switcher]")) return;
        sib.setAttribute("data-mixoff", "");
      });
      if (parent !== doc.body && !f.dataset.first) { parent.style.paddingTop = "0"; parent.style.marginTop = "0"; }
      keep = parent;
    }
    doc.documentElement.setAttribute("data-mix-isolated", ""); f._el = el;
    w.scrollTo(0, 0);
    return true;
  }
  function fit(f) {
    try {
      if (!isolate(f)) return;
      var w = f.contentWindow, doc = w.document;
      for (var i = 0; i < 4; i++) {
        var el = f._el || doc.body, r = el.getBoundingClientRect();
        var h = Math.max(160, Math.ceil(r.bottom + w.scrollY + parseFloat(w.getComputedStyle(el).marginBottom || 0)));
        if (f.dataset.first && f.dataset.key === "hero") h = Math.min(h, Math.max(560, innerHeight));
        var cur = parseFloat(f.style.height) || 900;
        if (Math.abs(cur - h) <= 2) break;
        f.style.height = h + "px"; void doc.documentElement.offsetHeight;
      }
      w.scrollTo(0, 0);
    } catch (e) {}
  }
  function start(f) {
    if (f.src) return;
    f.addEventListener("load", function () {
      f.parentNode.classList.remove("loading");
      // sizes settle as fonts, images and intros finish; re-fit a few times
      [200, 900, 2000, 3500].forEach(function (t) { setTimeout(function () { fit(f); }, t); });
    });
    f.src = f.dataset.src;
  }
  var frames = [].slice.call(d.querySelectorAll(".part iframe"));
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { start(e.target); io.unobserve(e.target); } }); }, { rootMargin: "1200px 0px" });
    frames.forEach(function (f) { io.observe(f); });
  } else frames.forEach(start);
  addEventListener("resize", function () { frames.forEach(function (f) { if (f.src) fit(f); }); });
})();
</script>
</body>
</html>
